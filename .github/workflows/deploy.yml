name: Hosting delivery
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Production {0} request {1}', inputs.source_sha, inputs.request_id) || format('Hosting {0} head {1} CI {2}/{3}', github.event.workflow_run.event, github.event.workflow_run.head_sha, github.event.workflow_run.id, github.event.workflow_run.run_attempt) }}
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation (release only at this checkpoint)
        required: true
        type: choice
        options:
          - release
      source_sha:
        description: Exact current-main SHA with successful eligible CI
        required: true
        type: string
      request_id:
        description: Optional local request correlation UUID
        required: false
        type: string
        default: ""
permissions: {}

concurrency:
  group: r4-hosting
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: ${{ github.repository == 'katpb/katpb.dev' && github.ref == 'refs/heads/main' && github.event.workflow_run.workflow_id == 374100170 && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: read
    outputs:
      control_sha: ${{ steps.resolve.outputs.control_sha }}
      eligible: ${{ steps.resolve.outputs.eligible }}
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install pinned trusted control toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          npm install --global --ignore-scripts npm@11.21.0
          test "$(npm --version)" = "11.21.0"
          npm ci --ignore-scripts
      - name: resolve
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-orchestrator.mjs --stage resolve
      - name: Download immutable prior verified receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ steps.resolve.outputs.prior_artifact_id != '' }}
        with:
          digest-mismatch: error
          artifact-ids: ${{ steps.resolve.outputs.prior_artifact_id }}
          run-id: ${{ steps.resolve.outputs.prior_run_id }}
          github-token: ${{ github.token }}
          path: .deploy/prior
      - name: Download exact validated CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ steps.resolve.outputs.eligible == 'true' }}
        with:
          digest-mismatch: error
          artifact-ids: ${{ steps.resolve.outputs.artifact_id }}
          path: .deploy/candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: prepare
        if: ${{ steps.resolve.outputs.eligible == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-orchestrator.mjs --stage prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: archive
        if: ${{ always() }}
        with:
          name: r4-preview-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/preview/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  announce:
    needs: [prepare]
    if: ${{ needs.prepare.outputs.eligible == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: write
    outputs:
      deployment_id: ${{ steps.announce.outputs.deployment_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install pinned trusted control toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          npm install --global --ignore-scripts npm@11.21.0
          test "$(npm --version)" = "11.21.0"
          npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: .deploy/preview
      - name: announce
        id: announce
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-orchestrator.mjs --stage announce
  provider:
    needs: [prepare, announce]
    if: ${{ needs.prepare.outputs.eligible == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    environment:
      name: preview
      deployment: false
    outputs:
      uploaded: ${{ steps.provider.outputs.uploaded }}
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install pinned trusted control toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          npm install --global --ignore-scripts npm@11.21.0
          test "$(npm --version)" = "11.21.0"
          npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: .deploy/preview
      - name: provider
        id: provider
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-orchestrator.mjs --stage provider
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: archive
        if: ${{ always() }}
        with:
          name: r4-preview-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/provider/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  verify:
    needs: [prepare, provider]
    if: ${{ needs.provider.outputs.uploaded == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install pinned trusted control toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          npm install --global --ignore-scripts npm@11.21.0
          test "$(npm --version)" = "11.21.0"
          npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: .deploy/preview
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.provider.outputs.artifact_id }}
          path: .deploy/provider
      - name: Install pinned hosted-test browsers without provider credentials
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium webkit
      - name: verify
        run: node scripts/release-orchestrator.mjs --stage verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: archive
        if: ${{ always() }}
        with:
          name: r4-preview-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/verification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  report:
    needs: [prepare, announce, provider, verify]
    if: ${{ always() && needs.prepare.outputs.control_sha != '' && needs.prepare.outputs.artifact_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install pinned trusted control toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          npm install --global --ignore-scripts npm@11.21.0
          test "$(npm --version)" = "11.21.0"
          npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: .deploy/preview
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ needs.provider.outputs.artifact_id != '' }}
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.provider.outputs.artifact_id }}
          path: .deploy/provider
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ needs.verify.outputs.artifact_id != '' }}
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: .deploy/verification
      - name: report
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ needs.announce.outputs.deployment_id }}
          PROVIDER_JOB_RESULT: ${{ needs.provider.result }}
          VERIFY_JOB_RESULT: ${{ needs.verify.result }}
          VERIFICATION_ARTIFACT_ID: ${{ needs.verify.outputs.artifact_id }}
        run: node scripts/release-orchestrator.mjs --stage report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: archive
        if: ${{ always() }}
        with:
          name: r4-preview-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/final/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  production_prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: read
    if: ${{ github.repository == 'katpb/katpb.dev' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_run' && github.event.workflow_run.workflow_id == 374100170 && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'release')) }}
    outputs:
      control_sha: ${{ steps.resolve.outputs.control_sha }}
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned trusted control toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          npm install --global --ignore-scripts npm@11.21.0
          test "$(npm --version)" = "11.21.0"
          npm ci --ignore-scripts
      - name: Production resolve
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-orchestrator.mjs --production-stage resolve
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          digest-mismatch: error
          artifact-ids: ${{ steps.resolve.outputs.candidate_artifact_id }}
          path: .deploy/production-candidate
          run-id: ${{ steps.resolve.outputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Production prepare
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-orchestrator.mjs --production-stage prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: handoff
        if: ${{ always() }}
        with:
          name: r4-production-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/production
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  production_archive:
    needs:
      - production_prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      deployments: read
    environment:
      name: production-archive
      deployment: false
    outputs:
      release_id: ${{ steps.archive.outputs.release_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.production_prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned trusted control toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          npm install --global --ignore-scripts npm@11.21.0
          test "$(npm --version)" = "11.21.0"
          npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.production_prepare.outputs.artifact_id }}
          path: .deploy/production
      - name: Production archive
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          R4_ARCHIVE_APP_PRIVATE_KEY: ${{ secrets.R4_ARCHIVE_APP_PRIVATE_KEY }}
        run: node scripts/release-orchestrator.mjs --production-stage archive
  production_announce:
    needs:
      - production_prepare
      - production_archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: write
    outputs:
      deployment_id: ${{ steps.announce.outputs.deployment_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.production_prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned trusted control toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          npm install --global --ignore-scripts npm@11.21.0
          test "$(npm --version)" = "11.21.0"
          npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.production_prepare.outputs.artifact_id }}
          path: .deploy/production
      - name: Production announce
        id: announce
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-orchestrator.mjs --production-stage announce
  production_provider:
    needs:
      - production_prepare
      - production_archive
      - production_announce
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    environment:
      name: production
      deployment: false
    outputs:
      uploaded: ${{ steps.provider.outputs.uploaded }}
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.production_prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned trusted control toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          npm install --global --ignore-scripts npm@11.21.0
          test "$(npm --version)" = "11.21.0"
          npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.production_prepare.outputs.artifact_id }}
          path: .deploy/production
      - name: Production provider
        id: provider
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_RELEASE_ID: ${{ needs.production_archive.outputs.release_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-orchestrator.mjs --production-stage provider
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: handoff
        if: ${{ always() }}
        with:
          name: r4-production-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/production-provider
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  production_verify:
    needs:
      - production_prepare
      - production_provider
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    if: ${{ needs.production_provider.outputs.uploaded == 'true' }}
    outputs:
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.production_prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned trusted control toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          npm install --global --ignore-scripts npm@11.21.0
          test "$(npm --version)" = "11.21.0"
          npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.production_prepare.outputs.artifact_id }}
          path: .deploy/production
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.production_provider.outputs.artifact_id }}
          path: .deploy/production-provider
      - name: Install pinned hosted browsers without credentials
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium webkit
      - name: Production verify
        id: verify
        run: node scripts/release-orchestrator.mjs --production-stage verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: handoff
        if: ${{ always() }}
        with:
          name: r4-production-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/production-verification
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  production_record:
    needs:
      - production_prepare
      - production_archive
      - production_announce
      - production_provider
      - production_verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    if: ${{ always() && needs.production_archive.result == 'success' }}
    environment:
      name: production-archive
      deployment: false
    outputs:
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.production_prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned trusted control toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          npm install --global --ignore-scripts npm@11.21.0
          test "$(npm --version)" = "11.21.0"
          npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.production_prepare.outputs.artifact_id }}
          path: .deploy/production
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.production_provider.outputs.artifact_id }}
          path: .deploy/production-provider
        if: ${{ needs.production_provider.outputs.artifact_id != '' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.production_verify.outputs.artifact_id }}
          path: .deploy/production-verification
        if: ${{ needs.production_verify.outputs.artifact_id != '' }}
      - name: Production record
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          R4_ARCHIVE_APP_PRIVATE_KEY: ${{ secrets.R4_ARCHIVE_APP_PRIVATE_KEY }}
          PRODUCTION_PROVIDER_RESULT: ${{ needs.production_provider.result }}
          PRODUCTION_VERIFY_RESULT: ${{ needs.production_verify.result }}
          PRODUCTION_DEPLOYMENT_ID: ${{ needs.production_announce.outputs.deployment_id }}
        run: node scripts/release-orchestrator.mjs --production-stage record
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: handoff
        if: ${{ always() }}
        with:
          name: r4-production-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/production-final
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  production_report:
    needs:
      - production_prepare
      - production_archive
      - production_announce
      - production_record
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: write
    if: ${{ always() && needs.production_archive.result == 'success' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.production_prepare.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned trusted control toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          npm install --global --ignore-scripts npm@11.21.0
          test "$(npm --version)" = "11.21.0"
          npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.production_prepare.outputs.artifact_id }}
          path: .deploy/production
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          digest-mismatch: error
          artifact-ids: ${{ needs.production_record.outputs.artifact_id }}
          path: .deploy/production-final
        if: ${{ needs.production_record.outputs.artifact_id != '' }}
      - name: Production report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_RELEASE_ID: ${{ needs.production_archive.outputs.release_id }}
          PRODUCTION_DEPLOYMENT_ID: ${{ needs.production_announce.outputs.deployment_id }}
        run: node scripts/release-orchestrator.mjs --production-stage report
