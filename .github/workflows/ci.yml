name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-health:
    name: repository-health
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install locked toolchain without lifecycle downloads
        run: |
          test "$(node --version)" = "v24.21.0"
          npm install --global --ignore-scripts npm@11.21.0
          test "$(npm --version)" = "11.21.0"
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium webkit
      - name: Verify exact clean source and prepare static output without credentials
        run: npm run release:prepare -- --source-sha "$SOURCE_SHA"
      - name: Archive verified raw bytes for trusted downstream preparation
        run: node scripts/hosting/archive-raw.mjs
      - name: Verify read-only protection drift against owner audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/hosting/check-protections.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: r4-raw-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/handoff/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
