<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
  <title>katpb.dev desktop homepage wireframe</title>
  <desc>Low-fidelity desktop wireframe with an identity rail, global navigation, professional introduction, featured writing, selected work, about preview, and footer.</desc>
  <defs>
    <style>
      .frame { fill: #ffffff; stroke: #171717; stroke-width: 2; }
      .rail { fill: #f5f5f5; }
      .section { fill: #fafafa; stroke: #aaaaaa; stroke-width: 1.2; }
      .line { stroke: #c8c8c8; stroke-width: 1; }
      .accent { fill: #5b2678; }
      .ink { fill: #171717; font-family: Arial, Helvetica, sans-serif; }
      .muted { fill: #666666; font-family: Arial, Helvetica, sans-serif; }
      .link { fill: #5b2678; font-family: Arial, Helvetica, sans-serif; font-weight: 700; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
      .nav { font-size: 15px; font-weight: 700; }
      .brand { font-size: 30px; font-weight: 700; }
      .h1 { font-size: 42px; font-weight: 700; }
      .h2 { font-size: 25px; font-weight: 700; }
      .h3 { font-size: 17px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 12px; }
    </style>
  </defs>

  <rect width="1440" height="1120" fill="#eeeeee"/>
